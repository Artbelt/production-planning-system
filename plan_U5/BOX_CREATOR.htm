<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Расчет коробок</title>
    <style>
        /* ===== Pro UI (neutral + single accent) ===== */
        :root{
            --bg:#f6f7f9;
            --panel:#ffffff;
            --ink:#1f2937;
            --muted:#6b7280;
            --border:#e5e7eb;
            --accent:#2457e6;
            --accent-ink:#ffffff;
            --radius:12px;
            --shadow:0 2px 12px rgba(2,8,20,.06);
            --shadow-soft:0 1px 8px rgba(2,8,20,.05);
        }
        html,body{height:100%}
        body{
            margin:0; background:var(--bg); color:var(--ink);
            font:14px/1.45 "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }
        a{color:var(--accent); text-decoration:none}
        a:hover{text-decoration:underline}

        /* контейнер и сетка */
        .container{ max-width:1280px; margin:0 auto; padding:16px; }

        /* панели */
        .panel{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:16px;
            margin-bottom:16px;
        }
        .section-title{
            font-size:15px; font-weight:600; color:#111827;
            margin:0 0 12px; padding-bottom:6px; border-bottom:1px solid var(--border);
        }

        /* кнопки (единый стиль) */
        button, input[type="submit"], .btn{
            appearance:none;
            border:1px solid transparent;
            cursor:pointer;
            background:var(--accent);
            color:var(--accent-ink);
            padding:7px 14px;
            border-radius:9px;
            font-weight:600;
            transition:background .2s, box-shadow .2s, transform .04s, border-color .2s;
            box-shadow:0 3px 6px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.08);
            text-decoration:none;
            display:inline-block;
        }
        button:hover, input[type="submit"]:hover, .btn:hover{ 
            background:#1e47c5; 
            box-shadow:0 2px 8px rgba(2,8,20,.10); 
            transform:translateY(-1px); 
        }
        button:active, input[type="submit"]:active, .btn:active{ transform:translateY(0); }
        button:disabled, input[type="submit"]:disabled{
            background:#e5e7eb; color:#9ca3af; border-color:#e5e7eb; box-shadow:none; cursor:not-allowed;
        }

        /* поля ввода/селекты */
        input[type="text"], input[type="date"], input[type="number"], input[type="password"],
        textarea, select{
            min-width:180px; padding:7px 10px;
            border:1px solid var(--border); border-radius:9px;
            background:#fff; color:var(--ink); outline:none;
            transition:border-color .2s, box-shadow .2s;
        }
        input:focus, textarea:focus, select:focus{
            border-color:#c7d2fe; box-shadow:0 0 0 3px #e0e7ff;
        }

        /* инфоблоки */
        .alert{
            background:#fffbe6; border:1px solid #f4e4a4; color:#634100;
            padding:10px; border-radius:9px; margin:12px 0; font-weight:600;
        }
        .muted{color:var(--muted); font-size:12px}

        /* форма */
        .form-group{
            display:flex; align-items:center; gap:12px; margin-bottom:12px;
        }
        .form-group label{
            font-weight:600; min-width:120px; color:var(--ink);
        }
        .form-group input{
            flex:1; max-width:200px;
        }

        /* адаптив */
        @media (max-width:768px){
            .form-group{flex-direction:column; align-items:stretch; gap:6px}
            .form-group label{min-width:auto}
            .form-group input{max-width:none}
        }
    </style>
</head>
<script>
    /*' WriteDXFPolygon creates a minimal DXF file that only contains
    ' the ENTITIES section. This subroutine requires five parameters,
    ' the DXF file name, the number of sides for the polygon, the X
    ' and Y coordinates for the bottom end of the right-most side
    ' (it starts in a vertical direction), and the length for each
    ' side. Note that because this only requests 2D points, it does
    ' not include the Z coordinates (codes 30 and 31). The lines are
    ' placed on the layer "Polygon."
    '
    */

    let area;

    function start_of_file() {
        //let area = document.getElementById("out");
        area = "0\n";
        area = area + "SECTION\n";
        area = area + "2\n";
        area = area + "ENTITIES\n";
    }
    function end_of_file() {
        //let area = document.getElementById("out");
        area = area + "0\n";
        area = area + "ENDSEC\n";
        area = area + "0\n";
        area = area + "EOF\n";
    }
    function line(sx,sy,ex,ey,label) {
        area = area +"0"+"\n";
        area = area +"LINE"+"\n";
        area = area +"8"+"\n";
        area = area +"Polygon"+"\n";
        area = area +"10"+"\n";
        area = area +sx+"\n";
        area = area +"20"+"\n";
        area = area +sy+"\n";
        area = area +"11"+"\n";
        area = area +ex+"\n";
        area = area +"21"+"\n";
        area = area +ey+"\n";

        if (Number.isNaN(ey)){alert("NaN"+label)}

    }
    function circle(sx,sy,r){
        area = area +"0"+"\n";
        area = area +"CIRCLE"+"\n";
        area = area +"8"+"\n";
        area = area +"Polygon"+"\n";
        area = area +"10"+"\n";
        area = area +sx+"\n";
        area = area +"20"+"\n";
        area = area +sy+"\n";
        area = area +"40"+"\n";
        area = area +r+"\n";

    }
    function arc(sx,sy,r,sa,ea){
        area = area +"0"+"\n";
        area = area +"ARC"+"\n";
        area = area +"8"+"\n";
        area = area +"Polygon"+"\n";
        area = area +"10"+"\n";
        area = area +sx+"\n";
        area = area +"20"+"\n";
        area = area +sy+"\n";
        area = area +"40"+"\n";
        area = area +r+"\n";
        area = area +"50"+"\n";
        area = area +sa+"\n";
        area = area +"51"+"\n";
        area = area +ea+"\n";

    }

    // Наружная кромка длинного клапана: выступ на четверти и ответный паз на трёх четвертях.
    // Оба длинных клапана получают один и тот же профиль, поэтому при складывании выступ попадает в паз.
    function drawLengthFlapOuter(x0, y0, length) {
        const quarter = length / 4;
        if (length < 80) {
            line(x0, y0, x0 + length, y0, 7);
            return;
        }
        line(x0, y0, x0 + quarter - 10, y0, 7);
        line(x0 + quarter - 10, y0, x0 + quarter - 10, y0 + 5, 7);
        arc(x0 + quarter - 5, y0 + 5, 5, 90, 180);
        line(x0 + quarter - 5, y0 + 10, x0 + quarter + 5, y0 + 10, 7);
        arc(x0 + quarter + 5, y0 + 5, 5, 0, 90);
        line(x0 + quarter + 10, y0 + 5, x0 + quarter + 10, y0, 7);
        line(x0 + quarter + 10, y0, x0 + 3 * quarter - 10, y0, 7);
        line(x0 + 3 * quarter - 10, y0, x0 + 3 * quarter - 10, y0 - 5, 7);
        arc(x0 + 3 * quarter - 5, y0 - 5, 5, 180, 270);
        line(x0 + 3 * quarter - 5, y0 - 10, x0 + 3 * quarter + 5, y0 - 10, 7);
        arc(x0 + 3 * quarter + 5, y0 - 5, 5, 270, 0);
        line(x0 + 3 * quarter + 10, y0 - 5, x0 + 3 * quarter + 10, y0, 7);
        line(x0 + 3 * quarter + 10, y0, x0 + length, y0, 7);
    }

    // Кромка короткого клапана с вырезом под палец. Дуга лежит на той же линии, что и разрыв.
    function drawWidthFlapOuter(x0, yEdge, width, arcStart, arcEnd) {
        const hole = 10;
        if (width <= hole * 2 + 4) {
            line(x0, yEdge, x0 + width, yEdge, 3);
            return;
        }
        const mid = x0 + width / 2;
        line(x0, yEdge, mid - hole, yEdge, 3);
        line(mid + hole, yEdge, x0 + width, yEdge, 3);
        arc(mid, yEdge, hole, arcStart, arcEnd);
    }

    function main() {
        let D =  Number(document.getElementById("length").value);//длина ящика
        let C =  Number(document.getElementById("width").value); //ширина ящика
        let A = Number(document.getElementById("height").value);
        let tail = 40;

        let gap =6;

        let B;
        //коэффициенты для корректировки длины клапанов
        let g1 = -0.25;
        let g2 = 2;
        //коэффициент для корректировки высоты ящика
        let h1 = 3*2;

        A = A + h1;


        B = C/2 + 4;

        const xC1 = tail;
        const xD1 = tail + C + gap;
        const xC2 = xD1 + D + gap;
        const xD2 = xC2 + C + gap;
        const xEnd = xD2 + D;

        start_of_file();
        //1 клеевой клапан
        line(0,0,tail,0,1);
        //2
        line(xC1,0,xC1,B+g1,2);
        //3 короткий клапан, верх
        drawWidthFlapOuter(xC1, B + g1, C, 180, 0);
        //4
        line(xC1+C,B+g1,xC1+C,0,4);
        //5
        line(xC1+C,0,xD1,0,5);
        //6
        line(xD1,0,xD1,B+g2,6);
        //7 длинный клапан, верх
        drawLengthFlapOuter(xD1, B + g2, D);
        //8
        line(xD1+D,B+g2,xD1+D,0,8);
        //9
        line(xD1+D,0,xC2,0,9);
        //10
        line(xC2,0,xC2,B+g1,10);
        //11 короткий клапан, верх
        drawWidthFlapOuter(xC2, B + g1, C, 180, 0);
        //12
        line(xC2+C,B+g1,xC2+C,0,12);
        //13
        line(xC2+C,0,xD2,0,13);
        //14
        line(xD2,0,xD2,B+g2,14);
        //15 длинный клапан, верх
        drawLengthFlapOuter(xD2, B + g2, D);

        let L1 = -1*(A+B);
        let L2 = -1 * A;
        //16
        line(xEnd,B+g2,xEnd,L1-g2,16);
        //32
        line(0,0,0,L2,32);
        //31
        line(0,L2,tail,L2,31);
        //30
        line(xC1,L2,xC1,L1-g1,30);
        //29 короткий клапан, низ. Центр дуги на кромке L1-g1, а не на L1.
        drawWidthFlapOuter(xC1, L1 - g1, C, 0, 180);
        //28
        line(xC1+C,L1-g1,xC1+C,L2,28);
        //27
        line(xC1+C,L2,xD1,L2,27);
        //26
        line(xD1,L2,xD1,L1-g2,26);
        //25 длинный клапан, низ
        drawLengthFlapOuter(xD1, L1 - g2, D);
        //24
        line(xD1+D,L1-g2,xD1+D,L2,24);
        //23
        line(xD1+D,L2,xC2,L2,23);
        //22
        line(xC2,L2,xC2,L1-g1,22);
        //21 короткий клапан, низ
        drawWidthFlapOuter(xC2, L1 - g1, C, 0, 180);
        //20
        line(xC2+C,L1-g1,xC2+C,L2,20);
        //19
        line(xC2+C,L2,xD2,L2,19);
        //18
        line(xD2,L2,xD2,L1-g2,18);
        //17 длинный клапан, низ
        drawLengthFlapOuter(xD2, L1 - g2, D);

        // биговка клапанов
        line(xC1,1.5,xC1+C,1.5);
        line(xD1,3,xD1+D,3);
        line(xC2,1.5,xC2+C,1.5);
        line(xD2,3,xD2+D,3);
        line(xC1,L2-1.5,xC1+C,L2-1.5);
        line(xD1,L2-3,xD1+D,L2-3);
        line(xC2,L2-1.5,xC2+C,L2-1.5);
        line(xD2,L2-3,xD2+D,L2-3);

        end_of_file();

    }

    function check_input() {
       if(document.getElementById("name").innerText == ''){
           alert("не введено название");
           return 0;
       }
    }

    //сохранение файла
    function save() {
        //блок проверки заполнения
        if(document.getElementById("name").value == ''){ alert("не указано название");return;}
        if(document.getElementById("length").value == ''){ alert("не указана длина");return;}
        if(document.getElementById("width").value == ''){ alert("не указана ширина");return;}
        if(document.getElementById("height").value == ''){ alert("не указана высота");return;}

        main();
       let art = document.getElementsByTagName('a')[0];

        const csv = area;

            const csvData = 'data:application/dxf;charset=utf-8,' + encodeURIComponent(csv);
            art.href = csvData;
            art.target = '_blank';
            art.download = document.getElementById("name").value + '.dxf';
    }

</script>
<body>
<div class="container">
    <div class="panel">
        <div class="section-title">Расчет коробок</div>
        <p class="muted">Создание DXF схемы для производства коробок</p>
    </div>

    <div class="panel">
        <div class="section-title">Параметры ящика</div>
        <div class="form-group">
            <label for="name">Номер ящика:</label>
            <input type="text" id="name" placeholder="AF ХХХХ"/>
        </div>
        <div class="form-group">
            <label for="length">Длина ящика:</label>
            <input type="text" id="length" placeholder="ХХХ"/>
        </div>
        <div class="form-group">
            <label for="width">Ширина ящика:</label>
            <input type="text" id="width" placeholder="ХХХ"/>
        </div>
        <div class="form-group">
            <label for="height">Высота ящика:</label>
            <input type="text" id="height" placeholder="ХХХ"/>
        </div>
    </div>

    <div class="panel">
        <a class="btn" onclick="save()">📦 Создать схему ящика</a>
    </div>
</div>
</body>
</html>
